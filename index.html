<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Ketersediaan | Sewa Apartemen Balikpapan</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .booking-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            padding: 36px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #eae7e2;
            position: relative;
        }

        .logo-container {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 2px;
            color: #71717a;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 700;
        }

        h2 {
            font-size: 22px;
            color: #18181b;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .description {
            font-size: 13px;
            color: #71717a;
            margin-bottom: 24px;
        }

        /* Toggle Button Harian / Bulanan */
        .toggle-container {
            display: flex;
            background: #f4f4f5;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid #e4e4e7;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            color: #71717a;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: #ffffff;
            color: #18181b;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            font-weight: 600;
        }

        /* Input Date Box */
        .date-box {
            text-align: left;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: #ffffff;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .date-box:hover {
            border-color: #122723;
        }

        .date-label {
            font-size: 10px;
            font-weight: 700;
            color: #71717a;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }

        .date-value {
            font-size: 14px;
            font-weight: 600;
            color: #18181b;
        }

        .duration-info {
            font-size: 13px;
            color: #71717a;
            text-align: left;
            margin-bottom: 20px;
            padding-left: 4px;
        }

        /* Action Buttons */
        .btn-check {
            width: 100%;
            padding: 13px;
            background-color: #122723;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .btn-check:hover {
            background-color: #1c3b35;
        }

        .btn-whatsapp {
            width: 100%;
            padding: 13px;
            background-color: #ffffff;
            color: #18181b;
            border: 1px solid #e4e4e7;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: #f4f4f5;
        }

        /* Overlay & Pop-up Kalender */
        .calendar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .calendar-dropdown {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: left;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .calendar-header span {
            font-size: 16px;
            font-weight: 600;
            color: #18181b;
        }

        .calendar-nav-btn {
            background: #122723;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 12px;
            transition: background 0.2s;
        }

        .calendar-nav-btn:hover {
            background: #1c3b35;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            margin-bottom: 20px;
        }

        .calendar-day-name {
            font-size: 11px;
            font-weight: 600;
            color: #a1a1aa;
            padding-bottom: 8px;
        }

        .calendar-date {
            font-size: 13px;
            color: #27272a;
            padding: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            transition: background 0.1s;
        }

        .calendar-date:hover:not(.disabled) {
            background-color: #f4f4f5;
        }

        .calendar-date.disabled {
            color: #d4d4d8;
            cursor: not-allowed;
            background: transparent !important;
        }

        /* Kapsul Range Selection */
        .calendar-date.selected-start {
            background-color: #122723 !important;
            color: #ffffff !important;
            font-weight: 600;
            border-top-left-radius: 50%;
            border-bottom-left-radius: 50%;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .calendar-date.selected-end {
            background-color: #122723 !important;
            color: #ffffff !important;
            font-weight: 600;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        .calendar-date.selected-single {
            background-color: #122723 !important;
            color: #ffffff !important;
            font-weight: 600;
            border-radius: 50%;
        }

        .calendar-date.in-range {
            background-color: #122723 !important;
            color: #ffffff !important;
            border-radius: 0;
        }

        .calendar-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f4f4f5;
            padding-top: 16px;
        }

        .calendar-footer-info {
            font-size: 13px;
            color: #71717a;
            font-weight: 500;
        }

        .btn-select-calendar {
            background-color: #122723;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-select-calendar:hover {
            background-color: #1c3b35;
        }

        /* Section Unit di Bawah */
        .section-unit {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 28px;
            border-radius: 20px;
            border: 1px solid #eae7e2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .section-unit h3 {
            font-size: 16px;
            color: #18181b;
            margin-bottom: 8px;
            font-weight: 600;
            text-align: left;
        }

        .unit-placeholder {
            font-size: 13px;
            color: #71717a;
            text-align: left;
            background: #f9f9f9;
            padding: 14px;
            border-radius: 8px;
            border: 1px dashed #d4d4d8;
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <div class="logo-container">
            <img src="icon.png" alt="Logo Pin">
        </div>

        <div class="subtitle">Selamat Datang di</div>
        <h2>Sewa Apartemen Balikpapan</h2>
        <p class="description">Temukan ruang nyaman untuk masa menginap Anda.</p>

        <!-- Toggle Harian / Bulanan -->
        <div class="toggle-container">
            <button class="toggle-btn active">Harian</button>
            <button class="toggle-btn">Bulanan</button>
        </div>

        <!-- Kolom Cek-In (Klik untuk buka pop-up kalender) -->
        <div class="date-box" id="open-calendar-in">
            <span class="date-label">CEK-IN</span>
            <div id="checkin-display" class="date-value">28 Oktober 2026</div>
        </div>

        <!-- Kolom Cek-Out (Klik untuk buka pop-up kalender) -->
        <div class="date-box" id="open-calendar-out">
            <span class="date-label">CEK-OUT</span>
            <div id="checkout-display" class="date-value">31 Oktober 2026</div>
        </div>

        <div style="margin-top: 16px; margin-bottom: 20px;" id="duration-display" class="duration-info">
            3 malam · Sewa harian
        </div>

        <button class="btn-check">Cek ketersediaan</button>
        <button class="btn-whatsapp">Chat via WhatsApp</button>
    </div>

    <!-- Modal Pop-up Kalender -->
    <div class="calendar-overlay" id="calendar-overlay">
        <div class="calendar-dropdown">
            <div class="calendar-header">
                <button class="calendar-nav-btn" id="prev-month-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="month-year-display">Oktober 2026</span>
                <button class="calendar-nav-btn" id="next-month-btn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <div class="calendar-day-name">Min</div>
                <div class="calendar-day-name">Sen</div>
                <div class="calendar-day-name">Sel</div>
                <div class="calendar-day-name">Rab</div>
                <div class="calendar-day-name">Kam</div>
                <div class="calendar-day-name">Jum</div>
                <div class="calendar-day-name">Sab</div>
            </div>
            <div class="calendar-footer">
                <div class="calendar-footer-info" id="popup-duration-info">3 malam</div>
                <button class="btn-select-calendar" id="btn-apply-date">Pilih</button>
            </div>
        </div>
    </div>

    <div class="section-unit">
        <h3>Pilih unit untuk menginap</h3>
        <div class="unit-placeholder">
            Konfigurasi belum lengkap.
        </div>
    </div>

    <script>
        const today = new Date(2026, 9, 28); 
        
        let currentMonth = 9; 
        let currentYear = 2026;

        let startDate = new Date(2026, 9, 28); 
        let endDate = new Date(2026, 9, 31);   
        let selectingStart = true;

        const monthsName = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        function formatDate(date) {
            return `${date.getDate()} ${monthsName[date.getMonth()]} ${date.getFullYear()}`;
        }

        const overlay = document.getElementById('calendar-overlay');

        // Event listener untuk membuka pop-up saat kotak Cek-In atau Cek-Out diklik
        document.getElementById('open-calendar-in').addEventListener('click', () => {
            overlay.style.display = 'flex';
            renderCalendar();
        });

        document.getElementById('open-calendar-out').addEventListener('click', () => {
            overlay.style.display = 'flex';
            renderCalendar();
        });

        // Tutup pop-up jika klik di luar area kalender
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.style.display = 'none';
            }
        });

        // Tombol Pilih di dalam pop-up
        document.getElementById('btn-apply-date').addEventListener('click', () => {
            overlay.style.display = 'none';
            updateUI();
        });

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const headers = Array.from(grid.children).slice(0, 7);
            grid.innerHTML = '';
            headers.forEach(h => grid.appendChild(h));

            document.getElementById('month-year-display').textContent = `${monthsName[currentMonth]} ${currentYear}`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-date disabled';
                grid.appendChild(emptyCell);
            }

            for (let d = 1; d <= totalDays; d++) {
                const currentDate = new Date(currentYear, currentMonth, d);
                const cell = document.createElement('div');
                cell.className = 'calendar-date';
                cell.textContent = d;

                if (currentDate < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
                    cell.classList.add('disabled');
                } else {
                    if (startDate && endDate && currentDate.getTime() === startDate.getTime() && currentDate.getTime() === endDate.getTime()) {
                        cell.classList.add('selected-single');
                    } else if (startDate && currentDate.getTime() === startDate.getTime()) {
                        cell.classList.add('selected-start');
                    } else if (endDate && currentDate.getTime() === endDate.getTime()) {
                        cell.classList.add('selected-end');
                    } else if (startDate && endDate && currentDate > startDate && currentDate < endDate) {
                        cell.classList.add('in-range');
                    }

                    cell.addEventListener('click', () => {
                        handleDateClick(currentDate);
                    });
                }

                grid.appendChild(cell);
            }

            updatePopupFooter();
        }

        function handleDateClick(date) {
            if (selectingStart) {
                startDate = date;
                endDate = null; 
                selectingStart = false;
            } else {
                if (date <= startDate) {
                    startDate = date;
                    endDate = null;
                } else {
                    endDate = date;
                    selectingStart = true;
                }
            }
            renderCalendar();
        }

        function updatePopupFooter() {
            if (startDate && endDate) {
                const diffTime = Math.abs(endDate - startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById('popup-duration-info').textContent = `${diffDays} malam`;
            } else {
                document.getElementById('popup-duration-info').textContent = `Pilih tanggal akhir`;
            }
        }

        function updateUI() {
            document.getElementById('checkin-display').textContent = formatDate(startDate);
            
            if (endDate) {
                document.getElementById('checkout-display').textContent = formatDate(endDate);
                const diffTime = Math.abs(endDate - startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById('duration-display').textContent = `${diffDays} malam · Sewa harian`;
            } else {
                document.getElementById('checkout-display').textContent = "Pilih tanggal...";
                document.getElementById('duration-display').textContent = `Pilih tanggal check-out (minimal 1 malam)`;
            }
        }

        document.getElementById('prev-month-btn').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        });

        document.getElementById('next-month-btn').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        });

        // Inisialisasi awal tampilan UI
        updateUI();
    </script>
</body>
</html>
