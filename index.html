```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking System</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Warna krim khusus untuk card */
        .bg-cream {
            background-color: #FAF6F0;
        }
        /* Custom styling untuk input date agar konsisten di berbagai browser */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 antialiased">

    <!-- Header Section -->
    <header class="w-full py-8 border-b border-slate-200/60 bg-white/50 backdrop-blur-sm">
        <div class="max-w-4xl mx-auto px-4">
            <!-- Container tengah untuk logo dan nama utama -->
            <div class="flex items-center justify-center gap-3">
                <!-- Icon kecil yang sejajar di kiri teks -->
                <div class="w-8 h-8 rounded-lg bg-amber-600/10 flex items-center justify-center text-amber-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <!-- Nama Utama -->
                <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900">
                    Pixel Booking
                </h1>
            </div>
        </div>
    </header>

    <!-- Body / Main Content Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            
            <!-- Card Utama dengan Warna Krim Muda -->
            <div class="bg-cream border border-amber-900/10 rounded-2xl p-6 md:p-8 shadow-sm transition-shadow hover:shadow-md">
                
                <form id="bookingForm" onsubmit="handleSubmit(event)" class="space-y-6">
                    
                    <!-- Input Check-In -->
                    <div class="space-y-2">
                        <label for="checkInDate" class="block text-xs font-bold tracking-wider text-amber-950 uppercase">
                            CHECK-IN
                        </label>
                        <div class="relative">
                            <input 
                                type="date" 
                                id="checkInDate" 
                                name="checkInDate"
                                required
                                class="w-full px-4 py-3 rounded-xl bg-white border border-amber-900/15 text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-amber-600/40 focus:border-amber-600 transition-all text-sm shadow-sm"
                            >
                        </div>
                    </div>

                    <!-- Input Check-Out -->
                    <div class="space-y-2">
                        <label for="checkOutDate" class="block text-xs font-bold tracking-wider text-amber-950 uppercase">
                            CHECK-OUT
                        </label>
                        <div class="relative">
                            <input 
                                type="date" 
                                id="checkOutDate" 
                                name="checkOutDate"
                                required
                                class="w-full px-4 py-3 rounded-xl bg-white border border-amber-900/15 text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-amber-600/40 focus:border-amber-600 transition-all text-sm shadow-sm"
                            >
                        </div>
                    </div>

                    <!-- Tombol Lanjut/Submit Optional (Bisa dihilangkan jika hanya butuh picker) -->
                    <button 
                        type="submit" 
                        class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-xl transition-colors shadow-sm focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
                    >
                        Simpan Tanggal
                    </button>

                </form>

                <!-- Message Alert Box (Pengganti alert bawaan browser) -->
                <div id="statusMessage" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center"></div>

            </div>

        </div>
    </main>

    <!-- Footer Sederhana -->
    <footer class="py-6 text-center text-xs text-slate-400">
        &copy; 2026 Pixel Booking. All rights reserved.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Set tanggal minimal hari ini untuk Check-in dan Check-out
        const today = new Date().toISOString().split('T')[0];
        const checkInInput = document.getElementById('checkInDate');
        const checkOutInput = document.getElementById('checkOutDate');

        checkInInput.min = today;
        checkOutInput.min = today;

        // Validasi otomatis agar tanggal Check-out tidak lebih awal dari Check-in
        checkInInput.addEventListener('change', (e) => {
            const selectedCheckIn = e.target.value;
            checkOutInput.min = selectedCheckIn;
            if (checkOutInput.value && checkOutInput.value < selectedCheckIn) {
                checkOutInput.value = selectedCheckIn;
            }
        });

        // Handler saat form dikirim
        function handleSubmit(event) {
            event.preventDefault();
            const checkIn = checkInInput.value;
            const checkOut = checkOutInput.value;

            const messageBox = document.getElementById('statusMessage');
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');

            if (checkOut < checkIn) {
                messageBox.classList.add('bg-red-100', 'text-red-700');
                messageBox.textContent = 'Tanggal Check-out tidak boleh sebelum Check-in.';
            } else {
                messageBox.classList.add('bg-emerald-100', 'text-emerald-700');
                messageBox.textContent = `Tanggal berhasil dipilih: ${checkIn} s/d ${checkOut}`;
            }
        }
    </script>
</body>
</html>
```
